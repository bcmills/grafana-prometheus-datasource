global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: discovery-bench
    honor_labels: true
    scrape_interval: 5s
    static_configs:
      - targets: ['discovery-fixture:9115']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: up
        action: drop
